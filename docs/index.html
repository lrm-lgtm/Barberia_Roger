<symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 16-5 16 0"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M2 20c0-5 14-5 14 0"/><path d="M17 5a3 3 0 0 1 0 6M18 16c2 0 4 1 4 4"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5 19 19M19 5 5 19"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 2 8 4v6c0 5-3 8-8 10-5-2-8-5-8-10V6z"/><path d="m9 12 2 2 4-4"/></symbol>
<symbol id="i-repeat" viewBox="0 0 24 24"><path d="M20 8V4l-3 3a8 8 0 1 0 2.4 8M20 8h-6"/></symbol>
<symbol id="i-bag" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="15" rx="2"/><path d="M9 9V5a3 3 0 0 1 6 0v4"/></symbol>
</svg>
<header class="top-demo"><div class="demo-sign">BARBEARIA · UX V3</div><nav class="mode-switch" aria-label="Prévia de áreas"><button data-mode="cliente" class="on">Cliente</button><button data-mode="barbeiro">Barbeiro</button><button data-mode="gestor">Gestor</button></nav></header>
<main id="stage" class="stage"></main>
<div id="modal-root"></div>
<script>
'use strict';
const I=(name)=>`<svg aria-hidden="true"><use href="#i-${name}"></use></svg>`;
const esc=(s)=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const money=(v)=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(v);
const services=[
{id:'corte',label:'Corte masculino',mins:35,price:45,icon:'cut',info:'Degradê, social ou tesoura',tag:'35 min',shadeA:'#25302a',shadeB:'#667467',photo:'https://images.unsplash.com/photo-1599351431202-1e0f0137899a?auto=format&fit=crop&w=480&h=520&q=78'},
{id:'combo',label:'Corte + barba',mins:60,price:70,icon:'cut',info:'Visual completo',tag:'60 min',shadeA:'#43362b',shadeB:'#a78b6b',photo:'https://images.unsplash.com/photo-1622286342621-4bd786c2447c?auto=format&fit=crop&w=480&h=520&q=78'},
{id:'barba',label:'Barba',mins:25,price:30,icon:'user',info:'Contorno e acabamento',tag:'25 min',shadeA:'#242d2f',shadeB:'#647f83',photo:'https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=480&h=520&q=78'},
{id:'infantil',label:'Corte infantil',mins:30,price:40,icon:'cut',info:'Até 12 anos',tag:'30 min',shadeA:'#444b36',shadeB:'#c6bd8d',photo:'https://images.unsplash.com/photo-1567894340315-735d7c361db0?auto=format&fit=crop&w=480&h=520&q=78'}
];
const staff=[{id:'any',name:'Qualquer disponível',sub:'Mais opções de horários'},{id:'rafa',name:'Rafael',sub:'Barbeiro'},{id:'bruno',name:'Bruno',sub:'Barbeiro'},{id:'lucas',name:'Lucas',sub:'Barbeiro'}];
const today=()=>{let n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const plus=(d,days)=>{let z=new Date(d.getFullYear(),d.getMonth(),d.getDate());z.setDate(z.getDate()+days);return z};
const iso=(d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fromIso=(v)=>{let [y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d)};
const dt=(d,opts)=>d.toLocaleDateString('pt-BR',opts);
const dayLabel=(d)=>dt(d,{weekday:'short'}).replace('.','').replace('-feira','').replace(/^[a-z]/,m=>m.toUpperCase());
const monthLabel=(d)=>dt(d,{month:'long'}).replace(/^./,m=>m.toUpperCase())+' '+d.getFullYear();
const state={mode:'cliente',step:1,service:null,barber:'any',date:iso(today()),time:null,returning:false,name:'',phone:'',marketing:false,staffOpen:false,calendarOpen:false,calPage:0};
const els={root:document.querySelector('#stage'),modal:document.querySelector('#modal-root')};
function service(){return services.find(s=>s.id===state.service)||services[0]}
function professional(){return staff.find(s=>s.id===state.barber)||staff[0]}
function offsetDays(d){return Math.round((d.getTime()-today().getTime())/86400000)}
function dateRange(){let center=fromIso(state.date),start=today();if(offsetDays(center)>13)start=plus(center,-3);if(start<today())start=today();return Array.from({length:18},(_,i)=>plus(start,i)).filter(d=>offsetDays(d)<61)}
function slots(dateStr=state.date){let d=fromIso(dateStr),off=offsetDays(d);if(d.getDay()===0)return [];
const base=['09:00','09:30','10:00','10:30','11:00','11:30','13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00'];
let result=base.filter((t,i)=>{let h=parseInt(t.slice(0,2)),minute=parseInt(t.slice(3));if(d.getDay()===6&&h>=15)return false;if(state.service==='combo'&&h>=18)return false;
if(state.barber==='rafa'&&h<10)return false;if(state.barber==='bruno'&&h>=17)return false;if(state.barber==='lucas'&&h<11)return false;
let salt={any:0,rafa:3,bruno:5,lucas:7}[state.barber];if((i*3+off+salt)%7===0)return false;if(state.barber!=='any'&&(i+off+salt)%5===0)return false;
if(off===0){let n=new Date();let min=n.getHours()*60+n.getMinutes()+40;if(h*60+minute<=min)return false}return true});
return result;
}
function wrapClient(content,footer=''){return `<div class="phone"><div class="brand-header"><div class="brand-mark">${I('cut')}</div><div><div class="brand-title">BARBER STUDIO</div><div class="brand-caption">Seu espaço, seu horário.</div></div><div class="brand-pulse"><i class="dot"></i> ONLINE</div></div><div class="phone-main" id="phone-scroll">${content}</div>${footer}</div>`}
function heading(back,title,number){return `<div class="page-head"><div class="head-nav"><button class="bare-back" onclick="go(${back})">${I('back')} Voltar</button><span class="progress-count">${number} DE 3</span></div><div class="progress"><span class="filled"></span><span class="${number>=2?'filled':''}"></span><span class="${number>=3?'filled':''}"></span></div><h1>${title}</h1></div>`}
function welcome(){return wrapClient(`<div class="hero"><div class="hero-eyebrow">BEM-VINDO À BARBEARIA</div><h1>Seu estilo.<br>Seu horário.</h1><p>Escolha o serviço e marque seu horário em poucos toques.</p></div><div class="inside"><button class="repeat" onclick="repeat()"><span class="round">${I('repeat')}</span><span><strong>Repetir meu último corte</strong><small>Agende de novo sem complicação</small></span>${I('chev')}</button><div class="service-heading"><div><h2>Escolha seu serviço</h2><p class="section-hint">Arraste para ver outras opções.</p></div><span class="swipe-guide">Deslize ${I('chev')}</span></div><div class="service-gallery" id="service-gallery" aria-label="Serviços disponíveis. Deslize na horizontal." onscroll="carouselUpdate()">${services.map((s,i)=>`<button type="button" class="service-card" onclick="choose('${s.id}')" aria-label="${s.label}, ${s.mins} minutos, ${money(s.price)}. Ver horários"><span class="service-card-photo" style="--shade-a:${s.shadeA};--shade-b:${s.shadeB}"><span class="service-art">${I(s.icon)}</span><img src="${s.photo}" alt="" loading="${i<2?'eager':'lazy'}" draggable="false" onerror="this.remove()"><span class="service-card-cover-tag">${s.tag}</span></span><span class="service-card-body"><span><strong class="service-card-name">${s.label}</strong><small class="service-card-description">${s.info}</small></span><span class="service-card-bottom"><strong class="service-card-price">${money(s.price)}</strong><span class="service-card-arrow">${I('chev')}</span></span></span></button>`).join('')}</div><div class="gallery-bottom"><div class="gallery-dots" id="gallery-dots">${services.map((_,i)=>`<span class="gallery-dot ${i===0?'active':''}"></span>`).join('')}</div><span class="gallery-count" id="gallery-count">1 de ${services.length} serviços</span></div><div class="carousel-tip">${I('shield')} Toque no serviço desejado para ver os horários livres.</div><div class="first-foot">Sem instalar aplicativo · Valores ilustrativos</div></div>`)}
function carouselUpdate(){const el=document.querySelector('#service-gallery'),dots=document.querySelectorAll('.gallery-dot'),label=document.querySelector('#gallery-count');if(!el||!dots.length)return;let card=el.querySelector('.service-card');if(!card)return;const idx=Math.min(services.length-1,Math.max(0,Math.round(el.scrollLeft/(card.getBoundingClientRect().width+12))));dots.forEach((d,i)=>d.classList.toggle('active',i===idx));if(label)label.textContent=`${idx+1} de ${services.length} serviços`;}

function foot(label,sub,action,disabled=false){return `<div class="sticky-action"><div class="sticky-meta"><small>${esc(label)}</small><strong>${esc(sub)}</strong></div><button class="next-btn" onclick="${action}" ${disabled?'disabled':''}>Continuar ${I('chev')}</button></div>`}
function availabilityText(){let d=fromIso(state.date);return `${dt(d,{weekday:'long',day:'2-digit',month:'long'})} · ${slots().length} horário${slots().length===1?'':'s'} livre${slots().length===1?'':'s'}`}
function datesMarkup(){return dateRange().map(d=>{let dISO=iso(d),isSel=dISO===state.date,off=offsetDays(d),sunday=d.getDay()===0;
return `<button type="button" class="date-cell ${isSel?'selected':''} ${off===0?'today':''} ${sunday?'closed':''}" onclick="chooseDate('${dISO}')" ${sunday?'disabled':''} aria-pressed="${isSel}"><strong>${d.getDate()}</strong><small>${off===0?'Hoje':off===1?'Amanhã':dayLabel(d)}</small><span class="availability"></span></button>`}).join('')}
function groupedSlots(){let all=slots();if(!all.length)return `<div class="empty-times">${I('cal')}<p>Sem vagas nesse dia. Você pode conferir a próxima data disponível.</p><button onclick="nextOpen()">Ver próximo dia livre ${I('chev')}</button></div>`;
return [{title:'Manhã',predicate:x=>+x.slice(0,2)<12},{title:'Tarde',predicate:x=>+x.slice(0,2)>=12&&+x.slice(0,2)<18},{title:'Noite',predicate:x=>+x.slice(0,2)>=18}].map(group=>{let t=all.filter(group.predicate);return !t.length?'':`<div class="period-head">${group.title}</div><div class="time-grid">${t.map(h=>`<button class="time-slot ${state.time===h?'on':''}" aria-pressed="${state.time===h}" onclick="chooseTime('${h}')">${h}</button>`).join('')}</div>`}).join('')}
function chooseScreen(){let s=service(),d=fromIso(state.date);let selected=state.time?`${dt(d,{day:'2-digit',month:'short'})} às ${state.time}`:'Selecione um horário';
return wrapClient(heading(1,'Escolha seu horário',2)+`<div class="booking-contents"><div class="selection-line">${I('cut')} ${esc(s.label)} <span>·</span> ${s.mins} min <span>·</span> ${money(s.price)}</div><section class="group"><div class="group-top"><h2 class="group-title">Profissional</h2></div><button class="staff-select" onclick="staffSheet(true)"><span class="staff-avatar">${state.barber==='any'?I('users'):esc(professional().name[0])}</span><span><strong>${esc(professional().name)}</strong><small>${esc(professional().sub)}</small></span>${I('chev')}</button></section><section class="group"><div class="month-head"><div class="month-title">${monthLabel(d)}</div><button class="month-trigger" onclick="calendarSheet(true)">${I('cal')} Ver calendário</button></div><div class="date-wrap" id="date-scroll"><div class="day-track">${datesMarkup()}</div></div><div class="day-caption">${I('clock')} ${availabilityText()}</div></section><section class="slots-section"><div class="group-top"><h2 class="group-title">Horários disponíveis</h2><span class="section-hint">Toque para escolher</span></div>${groupedSlots()}</section></div>`,foot('SEU HORÁRIO',selected,'go(3)',!state.time))}
function confirmScreen(){let d=fromIso(state.date),s=service();return wrapClient(heading(2,'Confirme seus dados',3)+`<div class="booking-contents"><p class="section-hint">Revise os detalhes antes de finalizar.</p><div class="summary-card"><div class="summary-row"><span>Serviço</span><strong>${s.label}</strong></div><div class="summary-row"><span>Profissional</span><strong>${esc(professional().name)}</strong></div><div class="summary-row"><span>Quando</span><strong>${dt(d,{weekday:'short',day:'2-digit',month:'short'})} · ${state.time}</strong></div><div class="summary-row total"><span>Valor no local</span><strong>${money(s.price)}</strong></div></div><div class="field"><label for="name">Seu nome</label><input id="name" autocomplete="name" placeholder="Seu primeiro nome e sobrenome" value="${esc(state.name)}" maxlength="65" oninput="state.name=this.value"></div><div class="field"><label for="phone">WhatsApp com DDD</label><input id="phone" autocomplete="tel" type="tel" inputmode="tel" placeholder="(11) 99999-9999" value="${esc(state.phone)}" maxlength="20" oninput="state.phone=this.value"></div><div id="validation-error" class="error" role="alert">Informe nome e número de celular válidos.</div><div class="notice">${I('shield')}<span>O número será usado para informações sobre a reserva. No aplicativo real, confirmação e acesso serão protegidos por verificação.</span></div><label class="optin"><input type="checkbox" ${state.marketing?'checked':''} onchange="state.marketing=this.checked"><span>Aceito receber promoções e convites para voltar à barbearia. (Opcional)</span></label></div>`,foot('TOTAL PREVISTO',money(s.price),'finish()'))}
function successScreen(){let s=service(),d=fromIso(state.date);return wrapClient(`<div class="inside" style="padding-top:4px"><div class="success-icon">${I('check')}</div><h1 class="success-title">Horário escolhido!</h1><p class="success-p">Você concluiu o fluxo de exemplo. Na versão real, a reserva só será confirmada após a validação do servidor.</p><div class="summary-card"><div class="summary-row"><span>Serviço</span><strong>${s.label}</strong></div><div class="summary-row"><span>Profissional</span><strong>${esc(professional().name)}</strong></div><div class="summary-row"><span>Data e hora</span><strong>${dt(d,{weekday:'short',day:'2-digit',month:'short'})} · ${state.time}</strong></div><div class="summary-row total"><span>Valor no local</span><strong>${money(s.price)}</strong></div></div><button class="next-btn full" onclick="restart()">Novo agendamento ${I('chev')}</button><div class="fake-label">PRÉVIA DEMONSTRATIVA · Nenhuma reserva ou mensagem foi enviada.</div></div>`)}
function renderStaff(){let bookings=[['09:00','Carlos Martins','Corte masculino','Finalizado'],['10:00','Pedro Lima','Corte + barba','Em atendimento'],['11:30','André Souza','Barba','Confirmado'],['14:00','Matheus Gomes','Corte masculino','Confirmado'],['16:00','Lucas Ferreira','Corte infantil','Confirmado']];els.root.innerHTML=`<div class="admin" style="max-width:620px"><div class="admin-head"><div><div class="small-kicker">ÁREA DO PROFISSIONAL</div><h1>Minha agenda</h1><p>Exemplo de agenda individual · Rafael</p></div><span class="status-pill">5 horários</span></div><div class="staff-feed">${bookings.map(b=>`<div class="staff-book"><time>${b[0]}</time><div><strong>${b[1]}</strong><small>${b[2]}</small></div><span>${b[3]}</span></div>`).join('')}</div><div class="demo-note">Dados ilustrativos. Acesso real por autenticação e permissões.</div></div>`}
function renderManager(){let cols=[['Rafael',[['09:00','Carlos Martins','Corte'],['10:00','Pedro Lima','Corte + barba'],['14:00','Matheus Gomes','Corte']]],['Bruno',[['09:30','Gabriel Oliveira','Corte'],['11:00','Fernanda Souza','Corte'],['15:00','Paulo Santos','Barba']]],['Lucas',[['10:00','Eduardo Lima','Corte + barba'],['13:30','Ricardo Costa','Corte'],['16:30','João Mendes','Corte']]]];els.root.innerHTML=`<div class="admin"><div class="admin-head"><div><div class="small-kicker">ADMINISTRAÇÃO</div><h1>Agenda geral</h1><p>Exemplo de visão operacional da barbearia</p></div><span class="status-pill">Hoje</span></div><div class="kpi-grid">${[['18','Atendimentos'],['14','Confirmados'],['3','Em andamento'],['1','Aguardando']].map(k=>`<div class="kpi"><b>${k[0]}</b><small>${k[1]}</small></div>`).join('')}</div><div class="admin-content"><h2 class="section-label">Agenda por barbeiro</h2><div class="board">${cols.map(c=>`<div class="board-col"><h3>${c[0]}</h3>${c[1].map(b=>`<div class="meeting"><b>${b[0]} · ${b[1]}</b><small>${b[2]}</small><em>● Confirmado</em></div>`).join('')}</div>`).join('')}</div></div><div class="demo-note">Painel apenas demonstrativo. Não possui cadastro nem financeiro conectado.</div></div>`}
function render(){document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===state.mode));let scroll=els.root.querySelector('#phone-scroll'),v=scroll?.scrollTop??0,days=els.root.querySelector('#date-scroll'),h=days?.scrollLeft??0;
if(state.mode==='cliente'){let html=state.step===1?welcome():state.step===2?chooseScreen():state.step===3?confirmScreen():successScreen();els.root.innerHTML=html;let newScroll=els.root.querySelector('#phone-scroll');if(newScroll)newScroll.scrollTop=v;let newDays=els.root.querySelector('#date-scroll');if(newDays){newDays.scrollLeft=h;if(!h&&offsetDays(fromIso(state.date))>13){let active=newDays.querySelector('.selected');if(active)active.scrollIntoView({inline:'center',block:'nearest'})}}}else if(state.mode==='barbeiro')renderStaff();else renderManager();renderModal()}
function redrawTop(){render();let scroll=els.root.querySelector('#phone-scroll');if(scroll)scroll.scrollTop=0}
function pickFirstAvailable(){if(slots().length)return;for(let i=1;i<=60;i++){let candidate=iso(plus(today(),i));if(slots(candidate).length){state.date=candidate;return}}}
function choose(id){state.service=id;state.time=null;state.step=2;state.date=iso(today());pickFirstAvailable();redrawTop()}
function repeat(){state.service='combo';state.barber='rafa';state.returning=true;state.name='Cliente de demonstração';state.phone='';state.time=null;state.step=2;state.date=iso(today());pickFirstAvailable();redrawTop()}
function go(n){if(n===3&&!state.time)return;if(n===2&&state.step===1&&!state.service)return;state.step=n;redrawTop()}
function chooseDate(value){state.date=value;state.time=null;render()}
function chooseTime(value){state.time=value;render()}
function nextOpen(){for(let n=1;n<60;n++){let d=plus(fromIso(state.date),n);if(offsetDays(d)>60)break;if(d.getDay()!==0&&slots(iso(d)).length){chooseDate(iso(d));break}}}
function finish(){let name=state.name.trim(),digits=state.phone.replace(/\D/g,'');if(name.length<2||digits.length<10||digits.length>11){let e=document.querySelector('#validation-error');if(e)e.style.display='block';return}state.step=4;redrawTop()}
function restart(){state.step=1;state.time=null;state.service=null;state.barber='any';state.date=iso(today());state.returning=false;state.name='';state.phone='';state.marketing=false;redrawTop()}
function staffSheet(open){state.staffOpen=open;renderModal()}
function calendarSheet(open){state.calendarOpen=open;if(open){let d=fromIso(state.date),n=today();state.calPage=(d.getFullYear()-n.getFullYear())*12+d.getMonth()-n.getMonth()}renderModal()}
function setStaff(id){state.barber=id;state.time=null;state.staffOpen=false;redrawTop()}
function monthMove(n){state.calPage=Math.max(0,Math.min(2,state.calPage+n));renderModal()}
function calendarDays(){let base=today(),month=new Date(base.getFullYear(),base.getMonth()+state.calPage,1);let count=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();let initial=(month.getDay()+6)%7;let html='<div class="weeklabels">'+['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>`<span>${x}</span>`).join('')+'</div><div class="calendar-grid">';for(let i=0;i<initial;i++)html+='<span class="empty-cell"></span>';for(let i=1;i<=count;i++){let d=new Date(month.getFullYear(),month.getMonth(),i),off=offsetDays(d),disabled=off<0||off>60||d.getDay()===0;html+=`<button aria-label="${dt(d,{day:'numeric',month:'long',year:'numeric'})}" class="${state.date===iso(d)?'sel':''}" onclick="dateFromCalendar('${iso(d)}')" ${disabled?'disabled':''}>${i}</button>`}return html+'</div>'}
function dateFromCalendar(value){state.date=value;state.time=null;state.calendarOpen=false;redrawTop()}
function renderModal(){if(state.staffOpen){els.modal.innerHTML=`<div class="scrim" onclick="staffSheet(false)"><div class="sheet" role="dialog" aria-modal="true" aria-label="Escolha um barbeiro" onclick="event.stopPropagation()"><div class="sheet-handle"></div><div class="sheet-head"><h2>Escolher profissional</h2><button onclick="staffSheet(false)" aria-label="Fechar">${I('close')}</button></div>${staff.map(p=>`<button class="staff-option ${state.barber===p.id?'sel':''}" onclick="setStaff('${p.id}')"><div class="staff-avatar">${p.id==='any'?I('users'):p.name[0]}</div><div><strong>${p.name}</strong><small>${p.sub}</small></div>${state.barber===p.id?I('check'):''}</button>`).join('')}</div></div>`}else if(state.calendarOpen){let base=today(),m=new Date(base.getFullYear(),base.getMonth()+state.calPage,1);els.modal.innerHTML=`<div class="scrim" onclick="calendarSheet(false)"><div class="sheet" role="dialog" aria-modal="true" aria-label="Calendário mensal" onclick="event.stopPropagation()"><div class="sheet-handle"></div><div class="sheet-head"><h2>Escolha uma data</h2><button onclick="calendarSheet(false)" aria-label="Fechar">${I('close')}</button></div><div class="cal-head"><button onclick="monthMove(-1)" ${state.calPage===0?'disabled':''} aria-label="Mês anterior">${I('back')}</button><strong>${monthLabel(m)}</strong><button onclick="monthMove(1)" ${state.calPage===2?'disabled':''} aria-label="Próximo mês">${I('chev')}</button></div>${calendarDays()}<div class="calendar-foot">Domingos e datas indisponíveis não podem ser escolhidos.</div></div></div>`}else els.modal.innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){state.staffOpen=false;state.calendarOpen=false;renderModal()}});
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{state.mode=b.dataset.mode;state.staffOpen=false;state.calendarOpen=false;render()}));
render();
</script>
</body>
</html>
