name: Publicar demonstração React
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/publish-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-demo
  cancel-in-progress: false
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build único do frontend React para prévia pública
        working-directory: frontend
        env:
          VITE_DEMO_MODE: 'true'
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Versionar preview compilado no diretório docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html docs/assets
          if ! git diff --cached --quiet; then
            git commit -m 'build(demo): atualizar prévia React [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
